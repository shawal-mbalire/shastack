name: Infra CI
on:
  push:
    paths: ['infra/**']
  pull_request:
    paths: ['infra/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - name: Build
        run: cd infra && just build
      - name: Test
        run: cd infra && just test
